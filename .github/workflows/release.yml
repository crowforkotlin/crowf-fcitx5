name: release

# Tag vX.Y.Z is the single source of truth. Pushing it:
#   1. derives PKGBUILD/.SRCINFO for that tag and builds *those files*,
#   2. publishes the same files to the AUR,
#   3. creates the GitHub release with the built package.
# Nothing is published if the build or any check fails.
#
# A tag archive cannot contain its own sha256, so packaging/release.sh computes
# it from the published archive. packaging/PKGBUILD in git is a template; only
# its pkgver must match the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag without the v prefix (e.g. 1.0.0)
        required: true

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  AUR_PKGNAME: fcitx5-theme-mellow-fixed

jobs:
  prepare:
    name: derive package files
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tagged PKGBUILD is read with git show

      - name: Resolve version
        id: v
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # makepkg refuses to run as root at all, including --printsrcinfo, so the
      # whole derivation runs as a normal user.
      - name: Generate PKGBUILD and .SRCINFO
        run: |
          pacman -Syu --noconfirm --needed git curl
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd '$PWD' && packaging/release.sh '${{ steps.v.outputs.version }}' --prepare aurfiles"
          ls -l aurfiles

      - uses: actions/upload-artifact@v4
        with:
          name: aur-files
          path: aurfiles/
          # .SRCINFO is hidden; the default excludes dotfiles, and without it
          # the AUR job has only PKGBUILD.
          include-hidden-files: true

  verify:
    name: build the prepared package
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur-files
          path: aurfiles

      # makepkg refuses to run as root, so the build runs as a normal user.
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed python-pillow
          useradd -m builder
          chown -R builder:builder aurfiles
          # --nodeps skips fcitx5 itself, which packaging does not need. The tag
          # archive checksum and check() both still run for real.
          su builder -c "cd aurfiles && makepkg -f --nodeps --noconfirm"

      - name: Collect artifact
        id: pkg
        run: |
          shopt -s nullglob
          files=(aurfiles/*.pkg.tar.zst)
          [ ${#files[@]} -eq 1 ] || { echo "expected one package, got ${#files[@]}" >&2; exit 1; }
          case "$(basename "${files[0]}")" in
          "$AUR_PKGNAME-${{ needs.prepare.outputs.version }}-"*) ;;
          *) echo "unexpected package name ${files[0]}" >&2; exit 1 ;;
          esac
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: ${{ steps.pkg.outputs.path }}

  aur:
    name: publish to AUR
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aur-files
          path: aurfiles

      - name: Install AUR key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "secret AUR_SSH_PRIVATE_KEY is unset" >&2; exit 1; }
          pacman -Syu --noconfirm --needed git openssh
          useradd -m builder
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          # Pin the host key: ssh-keyscan would trust whatever answers on port 22.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          su builder -c "git config --global core.sshCommand 'ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes'"
          chown -R builder:builder aurfiles

      # The verified files are published verbatim: no second checksum, no
      # second PKGBUILD generation.
      - name: Push PKGBUILD and .SRCINFO
        env:
          AUR_GIT_NAME: crowf release bot
          AUR_GIT_EMAIL: aur@aur.archlinux.org
        run: |
          su builder -c "cd '$PWD' && packaging/release.sh '${{ needs.prepare.outputs.version }}' --publish-from aurfiles"

  github-release:
    name: create GitHub release
    needs: [prepare, verify, aur]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.prepare.outputs.version }}" \
            --verify-tag --generate-notes ./*.pkg.tar.zst

# crowf-fcitx5 — theme.conf template for matugen.
#
# matugen substitutes each colors-dot-name-dot-default-dot-hex placeholder with
# the colour of that name from the palette it just generated. Which palette
# (dark or light) depends on the mode matugen ran in, so this single template
# serves both: run it in dark mode for the dark theme, light mode for light.
#
# Colour pairing notes (these are easy to get wrong and produce unreadable text):
#   * NormalColor must contrast with the panel fill.
#   * HighlightCandidateColor must contrast with the highlight fill, NOT with
#     the panel. The highlight fill comes from primary_fixed_dim, and
#     Material You's *_fixed* colours deliberately do not change between light
#     and dark schemes — so on_primary_fixed is the only text colour that stays
#     readable in both.
#   * Keep HighlightBackgroundColor equal to the highlight texture's fill so the
#     fallback path (clients that cannot decode SVG) matches the drawn pill.
#
# Geometry is 9-slice critical: 48x48 canvas, 20-unit margins leave an 8x8
# centre cell. See tools/check-geometry.py.
[Metadata]
Name=Crowf
Version=1.0
Author=crowf
Description=A rounded fcitx5 theme with Material You dynamic colours.
ScaleWithDPI=False

[InputPanel]
EnableBlur=False
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_primary_fixed.default.hex}}
HighlightColor={{colors.on_primary_fixed.default.hex}}
HighlightBackgroundColor={{colors.primary_fixed_dim.default.hex}}
FullWidthHighlight=True
Spacing=0

[InputPanel/ShadowMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/BlurMargin]

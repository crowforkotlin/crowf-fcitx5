<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  crowf-fcitx5 — input panel background.

  Geometry is 9-slice critical. Canvas 48x48 with 12-unit corner radius leaves a
  24x24 straight run on each edge, so a Margin of 20 still keeps an 8x8 centre
  cell to stretch. Never shrink the canvas or grow the radius without
  re-checking `tools/check-geometry.py`.

  Colors are injected as panel_fill / panel_stroke by tools/render.py, or as
  matugen's own color placeholders when the matugen template is used.
-->
<svg width="48" height="48" viewBox="0 0 48 48" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <path
     id="panel"
     style="fill:{{panel_fill}};stroke:{{panel_stroke}};stroke-width:0.5"
     d="M 16,4 H 32 A 12,12 0 0 1 44,16 V 32 A 12,12 0 0 1 32,44 H 16 A 12,12 0 0 1 4,32 V 16 A 12,12 0 0 1 16,4 Z" />
</svg>

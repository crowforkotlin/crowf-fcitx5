<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  crowf-fcitx5 — highlighted candidate pill.

  Matches the panel geometry so the pill nests inside the panel border. The
  radius (10) sits inside panel's (12), which keeps the visual rhythm when the
  highlight is drawn at full width (FullWidthHighlight=true).
-->
<svg width="48" height="48" viewBox="0 0 48 48" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <path
     id="highlight"
     style="fill:#80d4d8;fill-opacity:1;stroke:none"
     d="M 14,4 H 34 A 10,10 0 0 1 44,14 V 34 A 10,10 0 0 1 34,44 H 14 A 10,10 0 0 1 4,34 V 14 A 10,10 0 0 1 14,4 Z" />
</svg>
